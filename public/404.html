<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>StudyMeter</title>
  <script>
    // GitHub Pages SPA 라우팅 우회
    // base path 세그먼트 수: /studymeter/ → 1
    var n = 1;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + n).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(n).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
