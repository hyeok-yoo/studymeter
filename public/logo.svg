<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Deep dark base with subtle gradient -->
  <rect width="512" height="512" rx="120" fill="url(#bg_gradient)"/>
  
  <!-- Outer Glow Filter -->
  <defs>
    <filter id="glass_blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
    <linearGradient id="bg_gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="ring_gradient" x1="100" y1="100" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="glass_surface" x1="150" y1="100" x2="350" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="white" stop-opacity="0.2"/>
      <stop offset="1" stop-color="white" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Abstract Stopwatch Ring -->
  <circle cx="256" cy="256" r="160" stroke="url(#ring_gradient)" stroke-width="32" stroke-linecap="round"/>
  
  <!-- "Study" Element: Abstract Open Book / Progress Arc -->
  <path d="M190 256 C 190 290, 220 320, 256 320 C 292 320, 322 290, 322 256" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M256 320 V 220" stroke="white" stroke-width="24" stroke-linecap="round" opacity="0.9"/>

  <!-- Clock Hands / Progress Indicator -->
  <path d="M256 256 L 310 200" stroke="#facc15" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Stopwatch Top Button -->
  <path d="M236 60 H 276" stroke="url(#ring_gradient)" stroke-width="24" stroke-linecap="round"/>
  <path d="M256 60 V 96" stroke="url(#ring_gradient)" stroke-width="24"/>
  
  <!-- Glassmorphism Overlay (Lens Reflection) -->
  <circle cx="256" cy="256" r="150" fill="url(#glass_surface)" style="mix-blend-mode: overlay"/>
  
  <!-- Subtle Highlight -->
  <path d="M160 160 Q 256 60 352 160" stroke="white" stroke-width="4" stroke-opacity="0.3" fill="none"/>

</svg>
