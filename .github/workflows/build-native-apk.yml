name: Build Native APK

on:
  push:
    branches: [ main ]
    paths:
      - 'native/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: native/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        working-directory: native
        run: npm ci

      # 의존성은 위에서 npm ci로 이미 설치했으므로 --no-install로 재설치를 건너뛰고,
      # --clean으로 기존 네이티브 디렉터리를 지운 뒤 새로 생성한다 (Expo 공식 CI 권장 조합).
      # New Architecture / JS 엔진 등은 app.json에 별도 설정이 없으므로 Expo SDK 57 기본값(신규 아키텍처 활성화)이 그대로 적용된다.
      - name: Prebuild native Android project
        working-directory: native
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > native/android/local.properties

      - name: Make gradlew executable
        run: chmod +x native/android/gradlew

      # 디버그 서명 일관성: AGP 기본 debug signingConfig는 ~/.android/debug.keystore를 쓰는데,
      # 신규 러너에는 이 파일이 없어 실행마다 새 키가 생성된다(→ 덮어쓰기 설치 실패).
      # 웹 APK와 동일하게 저장소에 커밋된 고정 debug 키스토어(android/app/debug.keystore,
      # 기본 자격증명 androiddebugkey/android)를 복사해 모든 빌드의 서명을 동일하게 유지한다.
      - name: Use fixed debug keystore (consistent signing across builds)
        run: |
          mkdir -p ~/.android
          cp android/app/debug.keystore ~/.android/debug.keystore

      # debug 빌드는 JS 번들을 APK에 넣지 않고 Metro 개발 서버를 찾는다
      # ("Unable to load script" 크래시). release 빌드는 Hermes 번들을 내장해
      # 단독 실행 가능하며, RN 템플릿 기본값대로 debug 키스토어로 서명된다
      # (위에서 고정 키스토어를 복사했으므로 서명은 빌드마다 동일).
      - name: Build release APK (self-contained JS bundle)
        run: cd native/android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: studymeter-native-build-${{ github.run_number }}
          path: native/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
