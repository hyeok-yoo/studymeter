name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (Capacitor target)
        run: npm run build:app

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Patch all Capacitor proguard references for AGP 9+
        run: |
          grep -rl "proguard-android\.txt" node_modules/@capacitor node_modules/@capacitor-community 2>/dev/null \
            | grep "\.gradle$" \
            | xargs -r sed -i "s/getDefaultProguardFile('proguard-android\.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g"

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
            echo "Using stored keystore from secrets"
          else
            keytool -genkeypair -v \
              -keystore android/app/keystore.jks \
              -alias studymeter \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.KEYSTORE_PASSWORD || 'studymeter_ci' }}" \
              -keypass "${{ secrets.KEY_PASSWORD || 'studymeter_ci' }}" \
              -dname "CN=StudyMeter, OU=App, O=StudyMeter, L=Seoul, S=Seoul, C=KR"
            echo "Generated temporary keystore for CI build"
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'studymeter_ci' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'studymeter' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'studymeter_ci' }}
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: studymeter-release-build-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
