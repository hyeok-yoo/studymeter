<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep Space / Tech Background -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1A1B41"/>
      <stop offset="100%" stop-color="#080812"/>
    </radialGradient>

    <!-- Holographic Cyan -->
    <linearGradient id="holoCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0080FF"/>
    </linearGradient>

    <!-- Cyber Magenta -->
    <linearGradient id="cyberMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF003C"/>
      <stop offset="100%" stop-color="#9D00FF"/>
    </linearGradient>

    <!-- Electric Purple -->
    <linearGradient id="electricPurple" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowHeavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect width="1024" height="1024" rx="225" fill="url(#bgGrad)"/>
  
  <!-- Subtle Background Grid for HUD vibe -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
  <rect width="1024" height="1024" fill="url(#grid)"/>

  <!-- Outer Dashboard Ring -->
  <circle cx="512" cy="512" r="380" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2"/>
  <circle cx="512" cy="512" r="380" fill="none" stroke="url(#electricPurple)" stroke-width="6" stroke-dasharray="100 200" filter="url(#glowSubtle)"/>

  <!-- Left/Right tech brackets -->
  <path d="M 200 350 L 150 400 L 150 624 L 200 674" fill="none" stroke="url(#holoCyan)" stroke-width="8" stroke-linecap="square" filter="url(#glowSubtle)"/>
  <path d="M 824 350 L 874 400 L 874 624 L 824 674" fill="none" stroke="url(#cyberMagenta)" stroke-width="8" stroke-linecap="square" filter="url(#glowSubtle)"/>

  <!-- Main Progress Arc (Meter) -->
  <path d="M 300 780 A 340 340 0 1 1 724 780" fill="none" stroke="#101126" stroke-width="50" stroke-linecap="round"/>
  <!-- Active Progress (about 75%) -->
  <path d="M 300 780 A 340 340 0 1 1 790 310" fill="none" stroke="url(#holoCyan)" stroke-width="50" stroke-linecap="round" filter="url(#glowHeavy)"/>
  <path d="M 300 780 A 340 340 0 1 1 790 310" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>

  <!-- Glowing Progress Head (Orb) -->
  <circle cx="790" cy="310" r="30" fill="#FFFFFF" filter="url(#glowHeavy)"/>
  <circle cx="790" cy="310" r="15" fill="url(#holoCyan)"/>

  <!-- =============================== -->
  <!-- NEW CENTRAL ELEMENT: Growth Graph -->
  <!-- =============================== -->

  <!-- Base Grid Line for the Chart -->
  <path d="M 300 680 L 724 680" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Glowing Histogram Bars (Performance metrics) -->
  <g filter="url(#glowSubtle)">
    <rect x="360" y="550" width="36" height="130" rx="6" fill="url(#cyberMagenta)" fill-opacity="0.8"/>
    <rect x="430" y="460" width="36" height="220" rx="6" fill="url(#cyberMagenta)" fill-opacity="0.8"/>
    <rect x="500" y="510" width="36" height="170" rx="6" fill="url(#cyberMagenta)" fill-opacity="0.8"/>
    <rect x="570" y="400" width="36" height="280" rx="6" fill="url(#cyberMagenta)" fill-opacity="0.8"/>
    <rect x="640" y="290" width="36" height="390" rx="6" fill="url(#cyberMagenta)" fill-opacity="0.9"/>
  </g>

  <!-- Trend Line Layer 1: Heavy Glow -->
  <path d="M 310 610 L 378 530 L 448 440 L 518 490 L 588 380 L 690 250" fill="none" stroke="url(#electricPurple)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowHeavy)"/>
  
  <!-- Trend Line Layer 2: White Core -->
  <path d="M 310 610 L 378 530 L 448 440 L 518 490 L 588 380 L 690 250" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Trend Line Layer 3: Cyan Center -->
  <path d="M 310 610 L 378 530 L 448 440 L 518 490 L 588 380 L 690 250" fill="none" stroke="url(#holoCyan)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arrow Head Heavy Glow -->
  <path d="M 690 250 L 690 330 M 690 250 L 610 250" fill="none" stroke="url(#electricPurple)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowHeavy)"/>
  
  <!-- Arrow Head White Core -->
  <path d="M 690 250 L 690 330 M 690 250 L 610 250" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Arrow Head Cyan Center -->
  <path d="M 690 250 L 690 330 M 690 250 L 610 250" fill="none" stroke="url(#holoCyan)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing Data Nodes (Plot Points) -->
  <circle cx="378" cy="530" r="10" fill="#FFFFFF" filter="url(#glowSubtle)"/>
  <circle cx="448" cy="440" r="10" fill="#FFFFFF" filter="url(#glowSubtle)"/>
  <circle cx="518" cy="490" r="10" fill="#FFFFFF" filter="url(#glowSubtle)"/>
  <circle cx="588" cy="380" r="10" fill="#FFFFFF" filter="url(#glowSubtle)"/>
  <circle cx="690" cy="250" r="14" fill="#00F0FF" filter="url(#glowSubtle)"/>
  <circle cx="690" cy="250" r="6" fill="#FFFFFF"/>

  <!-- =============================== -->
  
  <!-- Top / Bottom Data Lines -->
  <rect x="492" y="70" width="40" height="12" rx="6" fill="#00F0FF" filter="url(#glowHeavy)"/>
  <rect x="502" y="90" width="20" height="6" rx="3" fill="#FFFFFF" opacity="0.6"/>
  
  <rect x="462" y="920" width="100" height="8" rx="4" fill="#9D00FF" filter="url(#glowSubtle)"/>
</svg>
